name: Build & Deploy to AWS EC2 Instance

on:
  pull_request:
    branches:
      - deploy-to-ec2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23

      - name: Install dependencies
        run: go mod tidy

      - name: Run Go tests
        run: go test ./... -v --parallel=8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: 'public'

      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: public.ecr.aws
          REGISTRY_ALIAS: j6j1g9p3
          REPOSITORY: whois-api
          IMAGE_TAG: ${{ steps.tag_version.outputs.new_version }}
        run: |
          print "$REPOSITORY:latest $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:latest"
          docker build -t $REPOSITORY .
          docker tag $REPOSITORY:latest $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:latest
          docker push $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:latest
